[project]
name = "talyn-review-ranking"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "catboost>=1.2,<2",
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
]

[tool.uv]
dev-dependencies = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["review_rank"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
