name: Deploy admin

# Deploy the Talyn operator console — admin.talyn.dev — to Vercel on every
# push to main that touches it. Like apps/web (and unlike apps/marketing) this
# IS an npm workspace member, so everything installs from the ROOT lockfile.
#
# NAMING — there are now THREE Vercel projects and two of the three folder
# names disagree with their project names. The SECRET, not the folder, decides
# where a build lands:
#
#   VERCEL_PROJECT_ID_WEB    web   = the marketing WEBSITE   www.talyn.dev    apps/marketing
#   VERCEL_PROJECT_ID_APP    app   = the APPLICATION         app.talyn.dev    apps/web
#   VERCEL_PROJECT_ID_ADMIN  admin = the operator console    admin.talyn.dev  apps/admin
#
# Pointing this at the wrong project id would publish a cross-tenant admin
# console over a customer-facing domain, so check the secret rather than the
# path when editing.
#
# THIS WORKFLOW IS THE ONLY DEPLOY PATH. apps/admin/vercel.json sets
# `"git": { "deploymentEnabled": false }`, which turns off Vercel's own
# push-triggered builds — otherwise every push to main deploys admin.talyn.dev
# TWICE, once from here and once from Vercel's Git integration, and whichever
# finishes last wins the production alias.
#
# That race is not theoretical: on 2026-08-04 the two paths disagreed about
# env (Vercel's build had the real Supabase values, the CLI build got
# `[SENSITIVE]` placeholders) and the losing-but-later build served a white
# screen. Keeping one path means one thing to reason about — and this is the
# one to keep, because `check` typechecks before anything deploys.
#
# Deploys here still work: `git.deploymentEnabled` only governs Vercel's Git
# hooks, not an explicit `vercel deploy --prebuilt`.
on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/client/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Skip on forks — no secrets there and nothing to deploy.
    if: github.repository == 'Gilbert09/talyn'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # @talyn/client resolves from `dist`, not source, so both packages must
      # be BUILT before anything typechecks against them.
      - name: Build workspace deps
        run: |
          npm run build -w @talyn/shared
          npm run build -w @talyn/client

      - name: Typecheck
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.repository == 'Gilbert09/talyn'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Until the Vercel project exists, a push that touches apps/admin would
      # fail this job red on a missing project id. Skip cleanly instead —
      # `check` above still gates the code. (The guard lives inside a step,
      # not in `if:`, because the `secrets` context is not available in job
      # conditions.)
      - name: Is the Vercel project configured?
        id: gate
        run: |
          if [ -z "${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" ]; then
            echo "VERCEL_PROJECT_ID_ADMIN not set — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.gate.outputs.configured == 'true'
        run: npm i -g vercel

      # Run from the repo root — the Vercel project's Root Directory is pulled
      # with the project settings. VITE_TALYN_* build values live as Vercel
      # project environment variables so `vercel build` sees them.
      #
      # Those variables must NOT be marked "Sensitive" in Vercel. `vercel pull`
      # cannot decrypt a sensitive variable — it writes the literal string
      # `[SENSITIVE]`, which then gets baked into the bundle. buildEnv.ts
      # rejects that value by name now, so the build fails loudly instead of
      # shipping a white screen (which is what happened to the admin console on
      # 2026-08-04, because the guard only checked for EMPTY).
      - name: Pull Vercel environment
        if: steps.gate.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        if: steps.gate.outputs.configured == 'true'
        env:
          # Passed explicitly rather than relying on VERCEL_GIT_COMMIT_SHA:
          # `--prebuilt` runs after OUR checkout, so Vercel injects that
          # variable EMPTY. Here the cost is worse than the cosmetic one
          # apps/web paid — without a SHA you cannot tell which build
          # performed a mutation recorded in admin_audit_log.
          VITE_TALYN_BUILD_SHA: ${{ github.sha }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        # One archive, not one upload per file: the free plan allows 5,000 file
        # uploads a day, and on 2026-11-09 a busy day of pushes used them up.
        run: vercel deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
