name: Mobile update

# Every push to main that changes the app or the packages it bundles publishes an OTA update
# to the preview and internal-beta channels. Production updates and rollbacks stay on the approved
# Mobile release workflow. Set the repository variable MOBILE_UPDATES_AUTO to 0 to stop this workflow.
# Updates are unsigned by decision (2026-11-09): EAS code signing needs a paid EAS plan. EAS serves them
# over HTTPS, and only holders of EXPO_TOKEN or Expo project access can publish.
# After each publish, the Hermes source maps go to PostHog error tracking when the POSTHOG_CLI_API_KEY
# secret is set. Without it the maps are skipped with a notice and the run stays green.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, oldest first, so a slow run cannot land after a newer one.
concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview and internal-beta updates
    # An unset variable is null, and null != '0' is false in Actions expressions (both coerce to 0),
    # so the kill switch defaults to '1' before the comparison.
    if: github.repository == 'Gilbert09/talyn' && github.ref == 'refs/heads/main' && (vars.MOBILE_UPDATES_AUTO || '1') != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-updates
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      MOBILE_UPDATES_AUTO: ${{ vars.MOBILE_UPDATES_AUTO }}
    steps:
      - name: Require the Expo token
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set, so no mobile update was published."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for the PostHog upload key
        id: posthog
        if: steps.gate.outputs.run == 'true'
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::notice::POSTHOG_CLI_API_KEY is not set, so source maps are not uploaded to PostHog."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the pushed commit
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22.23.4'
      - name: Install without release secrets or caches
        if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Install the pinned EAS tool outside the app
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-eas-cli" --no-save --ignore-scripts --package-lock=false eas-cli@27.5.0
          echo "MOBILE_EAS_CLI_PATH=$RUNNER_TEMP/mobile-eas-cli/node_modules/eas-cli/bin/run" >> "$GITHUB_ENV"
      # The npm package downloads the pinned CLI binary in its install script, so scripts run here.
      - name: Install the pinned PostHog CLI outside the app
        if: steps.gate.outputs.run == 'true' && steps.posthog.outputs.upload == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/posthog-cli" --no-save --package-lock=false --no-audit --no-fund @posthog/cli@0.18.12
          echo "POSTHOG_CLI_PATH=$RUNNER_TEMP/posthog-cli/node_modules/@posthog/cli/run-posthog-cli.js" >> "$GITHUB_ENV"
      - name: Build shared packages
        if: steps.gate.outputs.run == 'true'
        run: npm run mobile:build:packages
      - name: Describe the update
        if: steps.gate.outputs.run == 'true'
        run: |
          subject="$(git log -1 --format=%s | tr -d '\r')"
          echo "MOBILE_UPDATE_MESSAGE=${subject} ($(git rev-parse --short HEAD))" >> "$GITHUB_ENV"
      # Preview first: a failure there stops the run before internal-beta testers receive the change.
      - name: Publish to preview
        if: steps.gate.outputs.run == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: node apps/mobile/scripts/publish-update.cjs preview --execute
      # Internal-beta uses the production EAS environment, which needs the approved production identity
      # (bundle IDs, scheme, HTTPS callback). Set MOBILE_UPDATES_INTERNAL_BETA=1 once that exists.
      - name: Publish to internal-beta
        if: steps.gate.outputs.run == 'true' && vars.MOBILE_UPDATES_INTERNAL_BETA == '1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: node apps/mobile/scripts/publish-update.cjs internal-beta --execute
