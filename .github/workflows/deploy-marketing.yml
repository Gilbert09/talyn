name: Deploy marketing

# Deploy the Talyn marketing site (apps/marketing, a standalone Next.js app
# outside the npm workspace) to Vercel on every push to main that touches it.
# Lint + typecheck gate the deploy so a broken build never ships. The desktop
# app and backend deploy via their own workflows.
on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Skip on forks — no secrets there and nothing to deploy.
    if: github.repository == 'Gilbert09/talyn'
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The marketing app has its own lockfile (not in the workspace).
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.repository == 'Gilbert09/talyn'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # The two Vercel deploys are now named for what they are: "web" is this,
      # the marketing WEBSITE (www.talyn.dev); "app" is the APPLICATION
      # (app.talyn.dev, deploy-app.yml, VERCEL_PROJECT_ID_APP).
      #
      # The fallback is transitional. VERCEL_PROJECT_ID_WEB has to be created
      # by hand — GitHub never exposes an existing secret's value, so the old
      # id can't be copied across automatically. Until it exists this keeps
      # using VERCEL_PROJECT_ID, so the rename cannot break a working deploy
      # midway. Drop the fallback (and delete VERCEL_PROJECT_ID) once
      # VERCEL_PROJECT_ID_WEB is set.
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel

      # Run from the repo root — the Vercel project's Root Directory
      # (apps/marketing) is pulled with the project settings, so build/deploy
      # resolve the Next.js app from there.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        # One archive, not one upload per file: the free plan allows 5,000 file
        # uploads a day, and on 2026-11-09 a busy day of pushes used them up.
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
