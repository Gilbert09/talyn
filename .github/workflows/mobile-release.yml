name: Mobile release

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [build, submit, update, rollback]
        required: true
      profile:
        type: choice
        options: [development, preview, internal-beta, production]
        required: true
      platform:
        type: choice
        options: [ios, android]
        required: true
      source_commit:
        description: Approved full commit SHA on main
        required: true
      build_number:
        description: Reserved increasing store build number
        required: true
      runtime_version:
        description: Exact platform fingerprint from the inspected binary; required for submit or updates
      build_id:
        description: Exact inspected EAS build ID; required for submit

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ contains(fromJSON('["internal-beta", "production"]'), inputs.profile) && 'mobile-production' || 'mobile-preview' }}
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      APP_ENV: ${{ contains(fromJSON('["internal-beta", "production"]'), inputs.profile) && 'production' || inputs.profile }}
      MOBILE_RELEASE_PROFILE: ${{ inputs.profile }}
      MOBILE_RELEASE_SHA: ${{ inputs.source_commit }}
      MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
      MOBILE_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      MOBILE_BUILD_ID: ${{ inputs.build_id }}
      MOBILE_RELEASE_APPROVED: ${{ vars.MOBILE_RELEASE_APPROVED }}
      MOBILE_RELEASE_ENVIRONMENT: ${{ contains(fromJSON('["internal-beta", "production"]'), inputs.profile) && 'mobile-production' || 'mobile-preview' }}
      EXPO_PUBLIC_API_ORIGIN: ${{ vars.EXPO_PUBLIC_API_ORIGIN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_AUTH_CALLBACK_URL: ${{ vars.EXPO_PUBLIC_AUTH_CALLBACK_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      TALYN_MOBILE_IOS_BUNDLE_ID: ${{ vars.TALYN_MOBILE_IOS_BUNDLE_ID }}
      TALYN_MOBILE_ANDROID_PACKAGE: ${{ vars.TALYN_MOBILE_ANDROID_PACKAGE }}
      TALYN_MOBILE_SCHEME: ${{ vars.TALYN_MOBILE_SCHEME }}
      TALYN_MOBILE_SUPPORT_URL: ${{ vars.TALYN_MOBILE_SUPPORT_URL }}
      TALYN_MOBILE_PRIVACY_URL: ${{ vars.TALYN_MOBILE_PRIVACY_URL }}
      TALYN_MOBILE_DELETION_URL: ${{ vars.TALYN_MOBILE_DELETION_URL }}
      # Mirrors eas.json: every profile except the development client runs signed updates.
      MOBILE_UPDATES_ENABLED: ${{ inputs.profile == 'development' && '0' || '1' }}
      MOBILE_ASC_APP_ID: ${{ vars.MOBILE_ASC_APP_ID }}
      MOBILE_APPLE_TEAM_ID: ${{ vars.MOBILE_APPLE_TEAM_ID }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: |
          test "$MOBILE_RELEASE_APPROVED" = true
          test "$(git rev-parse HEAD)" = "$MOBILE_RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install without release secrets or caches
        run: npm ci --ignore-scripts
      - name: Install the pinned EAS tool outside the app
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-eas-cli" --no-save --ignore-scripts --package-lock=false eas-cli@27.5.0
          echo "MOBILE_EAS_CLI_PATH=$RUNNER_TEMP/mobile-eas-cli/node_modules/eas-cli/bin/run" >> "$GITHUB_ENV"
      - name: Build shared packages
        run: npm run mobile:build:packages
      - name: Check the candidate
        env:
          APP_ENV: development
          MOBILE_RELEASE_PROFILE: development
          MOBILE_UPDATES_ENABLED: '0'
        run: |
          npm run mobile:release:check
          npm run mobile:check:graph
          npm run mobile:expo:check
          npm run mobile:doctor
          npm run mobile:lint
          npm run mobile:typecheck
          npm run mobile:test
      - name: Prepare protected files outside the repository
        env:
          RELEASE_EVIDENCE: ${{ secrets.MOBILE_RELEASE_EVIDENCE_JSON }}
          STORE_METADATA: ${{ secrets.MOBILE_STORE_METADATA_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'mobile-release-'));
          // Updates are unsigned by decision (2026-11-09), so no update certificate or signing key is written.
          const files = { MOBILE_RELEASE_EVIDENCE_PATH: [path.join(dir, 'evidence.json'), process.env.RELEASE_EVIDENCE] };
          files.MOBILE_STORE_METADATA_PATH = [path.join(dir, 'metadata.json'), process.env.STORE_METADATA];
          for (const [name, [file, value]] of Object.entries(files)) {
            if (!value) continue;
            const target = file;
            fs.writeFileSync(target, value, { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${target}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `MOBILE_RELEASE_TEMP=${dir}\n`);
          NODE
      - name: Run the approved operation
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run mobile:release:plan -- "$RELEASE_ACTION" "$MOBILE_RELEASE_PROFILE" "$RELEASE_PLATFORM" --execute
      - name: Remove protected files
        if: always()
        run: |
          if [ -n "$MOBILE_RELEASE_TEMP" ]; then rm -rf -- "$MOBILE_RELEASE_TEMP"; fi
